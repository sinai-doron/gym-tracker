name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: No Hebrew in Kotlin string literals
        run: scripts/check-hebrew-literals.sh

      # The app's exercise catalogue is built from catalogue/exercises.src.json; a source change
      # without a rebuild, or an exercise that breaks the rules (licence, muscles, presets), fails here.
      - name: Exercise catalogue is valid and up to date
        run: python3 -I catalogue/build_catalogue.py --check

      - name: Build and run unit tests
        run: ./gradlew verifyComposeVersions assembleDebug testDebugUnitTest

      # The bundle Play takes, built the way an upload is (unsigned here: the upload key never
      # leaves the owner's computer). Release-only checks, such as lintVital, run here too.
      - name: Build the release bundle
        run: ./gradlew bundleRelease

      # Room writes each database version's schema while building. A schema that changed without
      # being committed means a migration nobody can test against later.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: room-schemas
          path: app/schemas
          if-no-files-found: ignore
      - name: Room schemas are committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            git status --porcelain app/schemas
            echo "::error::Room schemas changed but aren't committed. Commit app/schemas (also in the room-schemas artifact)."
            exit 1
          fi

      - name: Upload unit test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests

  android-tests:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Room, sync and migration tests. BackupMigrationTest skips itself: no backup here, as real
      # training data never goes to GitHub.
      - name: Run instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/androidTests
